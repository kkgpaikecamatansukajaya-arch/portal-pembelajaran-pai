<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tugas PAI - SDN Kiarapandak 01</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar navbar-pai sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <span class="brand-badge"><i data-lucide="clipboard-list"></i></span>
        <span class="fw-bold" style="color: var(--pai-green-dark);">TUGAS PAI • SDN KIARAPANDAK 01</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm rounded-3">Dashboard</a>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-3">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h3 class="fw-bold mb-1">Tugas Individu & Kelompok</h3>
        <p class="text-muted mb-0">Kerjakan tugas tepat waktu dan kumpulkan jawaban Anda</p>
      </div>
      <button id="btnOpenCreateAssignment" class="btn btn-pai-primary d-none" data-bs-toggle="modal" data-bs-target="#createAssignmentModal">
        + Buat Tugas Baru
      </button>
    </div>

    <div id="assignmentsList" class="row g-4 mb-5">
      <div class="col-12 text-center text-muted py-4">Memuat daftar tugas...</div>
    </div>

    <!-- Panel Koreksi Pengumpulan Siswa (Guru & Admin) -->
    <div id="teacherSubmissionsPanel" class="pai-card p-4 d-none">
      <h4 class="fw-bold mb-3">Daftar Pengumpulan & Koreksi Tugas Siswa</h4>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Siswa</th>
              <th>Tugas</th>
              <th>Jawaban & File</th>
              <th>Nilai (0–100)</th>
              <th>Umpan Balik</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="submissionsCorrectionBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Buat Tugas (Guru & Admin) -->
  <div class="modal fade" id="createAssignmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Buat Tugas Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="createAssignmentForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Judul Tugas</label>
              <input type="text" id="asgTitle" class="form-control" required />
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Kelas</label>
                <select id="asgClassId" class="form-select" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Jenis Tugas</label>
                <select id="asgType" class="form-select">
                  <option value="Individu">Individu</option>
                  <option value="Kelompok">Kelompok</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Tenggat Waktu</label>
                <input type="datetime-local" id="asgDeadline" class="form-control" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Instruksi Tugas</label>
              <textarea id="asgDesc" rows="4" class="form-control" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-pai-primary rounded-3">Simpan Tugas</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Kumpulkan Tugas (Siswa) -->
  <div class="modal fade" id="submitAssignmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="submitModalTitle">Kumpulkan Tugas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="submitAssignmentForm">
          <div class="modal-body">
            <input type="hidden" id="subAssignmentId" />
            <div class="mb-3">
              <label class="form-label fw-semibold">Jawaban Teks</label>
              <textarea id="subAnswerText" rows="4" class="form-control" placeholder="Tuliskan jawaban Anda di sini..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Unggah File Jawaban (Foto/PDF/Dokumen - Opsional)</label>
              <input type="file" id="subFileInput" class="form-control" accept=".pdf,.doc,.docx,image/*" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Batal</button>
            <button type="submit" id="btnSubmitAssignment" class="btn btn-pai-primary rounded-3">Kirim Jawaban</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/tugas.js"></script>
</body>
</html>
