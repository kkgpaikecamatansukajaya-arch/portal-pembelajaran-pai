<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Portal PAI SDN Kiarapandak 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-3">
          <a href="/index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 text-muted small fw-semibold">
            <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Kembali ke Beranda
          </a>
        </div>

        <div class="pai-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="brand-badge mx-auto mb-3" style="width:56px;height:56px;border-radius:18px;">
              <i data-lucide="book-open-check" style="width:28px;height:28px;"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: var(--pai-green-dark);">Masuk Portal PAI</h3>
            <p class="text-muted small mb-0">SDN Kiarapandak 01 • Admin, Guru & Siswa</p>
          </div>

          <div id="loginAlert" class="alert alert-danger d-none small" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="identifierInput" class="form-label fw-semibold">Email atau Username</label>
              <input
                type="text"
                class="form-control form-control-lg rounded-3"
                id="identifierInput"
                placeholder="contoh: budi.kelas4 atau guru.pai@sekolah.id"
                required
              />
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="passwordInput" class="form-label fw-semibold mb-1">Kata Sandi</label>
                <a href="#" class="small text-decoration-none fw-semibold" style="color: var(--pai-blue);" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                  Lupa password?
                </a>
              </div>
              <input
                type="password"
                class="form-control form-control-lg rounded-3"
                id="passwordInput"
                placeholder="Masukkan kata sandi"
                required
              />
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn btn-pai-primary btn-lg w-100 mt-2">
              Masuk Sekarang
            </button>
          </form>

          <hr class="my-4" />
          <p class="text-center text-muted small mb-0">
            Belum memiliki akun? Hubungi <strong>Administrator</strong> atau <strong>Guru PAI</strong> SDN Kiarapandak 01.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Lupa Password -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Reset Kata Sandi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="forgotPasswordForm">
          <div class="modal-body">
            <p class="text-muted small">Masukkan alamat email akun Anda untuk menerima tautan pengaturan ulang kata sandi.</p>
            <div id="resetAlert" class="alert d-none small"></div>
            <label for="resetEmailInput" class="form-label fw-semibold">Alamat Email</label>
            <input type="email" id="resetEmailInput" class="form-control rounded-3" placeholder="nama@email.com" required />
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Tutup</button>
            <button type="submit" class="btn btn-pai-primary rounded-3">Kirim Tautan Reset</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();

      // Jika sudah login, alihkan langsung ke dashboard
      const { profile } = await window.PAI_AUTH.getCurrentUserProfile();
      if (profile) {
        window.location.href = "/dashboard.html";
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const roleHint = params.get("role");
      if (roleHint === "siswa") {
        document.getElementById("identifierInput").placeholder = "Username siswa (contoh: ahmad_k3) atau email";
      } else if (roleHint === "guru") {
        document.getElementById("identifierInput").placeholder = "Email atau username Guru PAI / Admin";
      }

      const loginForm = document.getElementById("loginForm");
      const alertBox = document.getElementById("loginAlert");
      const submitBtn = document.getElementById("btnLoginSubmit");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.classList.add("d-none");
        submitBtn.disabled = true;
        submitBtn.textContent = "Memeriksa akun...";

        const identifier = document.getElementById("identifierInput").value;
        const password = document.getElementById("passwordInput").value;

        const { error } = await window.PAI_AUTH.loginWithIdentifier(identifier, password);

        if (error) {
          alertBox.textContent = "Login gagal: periksa kembali username/email dan kata sandi Anda.";
          alertBox.classList.remove("d-none");
          submitBtn.disabled = false;
          submitBtn.textContent = "Masuk Sekarang";
          return;
        }

        window.location.href = "/dashboard.html";
      });

      const resetForm = document.getElementById("forgotPasswordForm");
      const resetAlert = document.getElementById("resetAlert");
      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const emailVal = document.getElementById("resetEmailInput").value;
        const { error } = await window.PAI_AUTH.sendPasswordReset(emailVal);
        resetAlert.classList.remove("d-none", "alert-danger", "alert-success");
        if (error) {
          resetAlert.classList.add("alert-danger");
          resetAlert.textContent = "Gagal mengirim email reset: " + error.message;
        } else {
          resetAlert.classList.add("alert-success");
          resetAlert.textContent = "Tautan reset password telah dikirim ke email Anda.";
        }
      });
    });
  </script>
</body>
</html>
