<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Nilai PAI - SDN Kiarapandak 01</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar navbar-pai sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <span class="brand-badge"><i data-lucide="award"></i></span>
        <span class="fw-bold" style="color: var(--pai-green-dark);">REKAP NILAI & RIWAYAT</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm rounded-3">Dashboard</a>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-3">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="fw-bold mb-1">Rekap Nilai Kuis, Tugas & Poin Prestasi</h3>
    <p class="text-muted mb-4">Pantau capaian akademik dan riwayat aktivitas belajar PAI</p>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="pai-card p-4 h-100">
          <h5 class="fw-bold mb-3">Nilai Kuis</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle small">
              <thead>
                <tr>
                  <th>Siswa</th>
                  <th>Kuis</th>
                  <th>Nilai</th>
                  <th>Tanggal</th>
                </tr>
              </thead>
              <tbody id="nilaiKuisBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="pai-card p-4 h-100">
          <h5 class="fw-bold mb-3">Nilai Tugas</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle small">
              <thead>
                <tr>
                  <th>Siswa</th>
                  <th>Tugas</th>
                  <th>Nilai</th>
                  <th>Umpan Balik</th>
                </tr>
              </thead>
              <tbody id="nilaiTugasBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="pai-card p-4">
          <h5 class="fw-bold mb-3">Riwayat Aktivitas & Poin Prestasi</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle small">
              <thead>
                <tr>
                  <th>Siswa</th>
                  <th>Aktivitas</th>
                  <th>Poin</th>
                  <th>Waktu</th>
                </tr>
              </thead>
              <tbody id="riwayatPoinBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nilai.js"></script>
</body>
</html>
