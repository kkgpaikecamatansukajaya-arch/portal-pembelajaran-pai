<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Edukasi PAI - SDN Kiarapandak 01</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar navbar-pai sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <span class="brand-badge"><i data-lucide="gamepad-2"></i></span>
        <span class="fw-bold" style="color: var(--pai-green-dark);">GAME EDUKASI PAI</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold">
          Total Poin: <span id="gameTotalPointsBadge">0</span>
        </span>
        <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm rounded-3">Dashboard</a>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-3">Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1">10 Game Edukasi PAI Seru!</h2>
      <p class="text-muted">Jawaban benar menambah +20 poin, jawaban salah mengurangi -5 poin • Hasil tersimpan otomatis ke Supabase</p>
    </div>

    <!-- Pilihan 10 Game -->
    <div id="gameMenuGrid" class="row g-3 mb-4"></div>

    <!-- Arena Permainan Aktif -->
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="gameArenaCard" class="pai-card p-4 d-none">
          <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <div>
              <span class="badge bg-success-subtle text-success-emphasis mb-1" id="arenaGameTitle"></span>
              <h5 class="fw-bold mb-0" id="arenaQuestionProgress">Soal 1</h5>
            </div>
            <div class="text-end">
              <div class="fw-bold fs-5 text-primary">Skor Sesi: <span id="arenaSessionScore">0</span></div>
              <button id="btnExitGame" class="btn btn-sm btn-outline-secondary mt-1">Kembali ke Menu Game</button>
            </div>
          </div>

          <div id="arenaPromptBox" class="p-3 rounded-3 stat-card-blue mb-3"></div>
          <div id="arenaChoicesBox" class="d-grid gap-2 mb-3"></div>
          <div id="arenaExplanationBox" class="alert d-none small mb-3"></div>
          <button id="btnNextGameQuestion" class="btn btn-pai-primary d-none">Lanjut Soal Berikutnya</button>
        </div>
      </div>

      <!-- Leaderboard Realtime -->
      <div class="col-lg-4">
        <div class="pai-card p-4">
          <h5 class="fw-bold mb-3">Papan Peringkat (Realtime)</h5>
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Nama</th>
                  <th class="text-end">Poin</th>
                </tr>
              </thead>
              <tbody id="gameLeaderboardBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
