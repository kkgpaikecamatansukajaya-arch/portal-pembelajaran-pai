<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya - Portal PAI SDN Kiarapandak 01</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav class="navbar navbar-pai sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard.html">
        <span class="brand-badge"><i data-lucide="arrow-left"></i></span>
        <span class="fw-bold" style="color: var(--pai-green-dark);">Kembali ke Dashboard</span>
      </a>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm rounded-3">Keluar</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="pai-card p-4 p-md-5">
          <div class="d-flex align-items-center gap-3 mb-4">
            <img
              id="profileAvatarPreview"
              src="https://ui-avatars.com/api/?name=PAI&background=0d9488&color=fff&size=96"
              alt="Avatar"
              class="rounded-circle border border-3 border-success-subtle"
              style="width:84px;height:84px;object-fit:cover;"
            />
            <div>
              <h4 id="profileDisplayName" class="fw-bold mb-1">Memuat...</h4>
              <div id="profileRoleBadge" class="mb-1"></div>
              <small id="profileClassInfo" class="text-muted"></small>
            </div>
          </div>

          <div id="profileAlert" class="alert d-none small"></div>

          <form id="profileForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nama Lengkap</label>
              <input type="text" id="fullNameInput" class="form-control rounded-3" required />
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" id="usernameInput" class="form-control rounded-3 bg-light" readonly />
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Ganti Foto Profil (Avatar)</label>
              <input type="file" id="avatarFileInput" class="form-control rounded-3" accept="image/*" />
            </div>

            <div class="p-3 rounded-3 stat-card-yellow mb-4 d-flex justify-content-between align-items-center">
              <span class="fw-semibold">Total Poin Prestasi</span>
              <span id="profilePointsBadge" class="badge bg-warning text-dark fs-6 px-3 py-2">0 Poin</span>
            </div>

            <button type="submit" id="btnSaveProfile" class="btn btn-pai-primary w-100">
              Simpan Perubahan Profil
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      const authCtx = await window.PAI_AUTH.requireAuth(["admin", "guru", "siswa"]);
      if (!authCtx) return;

      const { db, uploadFileToBucket } = window.PAI_APP;
      const { user, profile } = authCtx;

      document.getElementById("profileDisplayName").textContent = profile.full_name;
      document.getElementById("profileRoleBadge").innerHTML = window.PAI_AUTH.badgeRoleHTML(profile.role);
      document.getElementById("profileClassInfo").textContent = profile.classes
        ? `${profile.classes.class_name} • Tahun Ajaran ${profile.classes.academic_year}`
        : "SDN Kiarapandak 01";
      document.getElementById("fullNameInput").value = profile.full_name;
      document.getElementById("usernameInput").value = profile.username;
      document.getElementById("profilePointsBadge").textContent = `${profile.total_points || 0} Poin`;
      if (profile.avatar_url) {
        document.getElementById("profileAvatarPreview").src = profile.avatar_url;
      }

      const profileForm = document.getElementById("profileForm");
      const alertBox = document.getElementById("profileAlert");
      const saveBtn = document.getElementById("btnSaveProfile");

      profileForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = "Menyimpan...";
        alertBox.classList.add("d-none");

        let avatarUrl = profile.avatar_url;
        const avatarFile = document.getElementById("avatarFileInput").files[0];

        if (avatarFile) {
          const { url, error: upErr } = await uploadFileToBucket("avatars", avatarFile, user.id);
          if (upErr) {
            alertBox.className = "alert alert-danger small";
            alertBox.textContent = "Gagal upload foto profil: " + upErr.message;
            alertBox.classList.remove("d-none");
            saveBtn.disabled = false;
            saveBtn.textContent = "Simpan Perubahan Profil";
            return;
          }
          avatarUrl = url;
        }

        const newFullName = document.getElementById("fullNameInput").value.trim();
        const { error: updErr } = await db
          .from("profiles")
          .update({
            full_name: newFullName,
            avatar_url: avatarUrl,
            updated_at: new Date().toISOString()
          })
          .eq("id", user.id);

        alertBox.classList.remove("d-none", "alert-danger", "alert-success");
        if (updErr) {
          alertBox.classList.add("alert-danger");
          alertBox.textContent = "Gagal memperbarui profil: " + updErr.message;
        } else {
          alertBox.classList.add("alert-success");
          alertBox.textContent = "Profil berhasil diperbarui!";
          document.getElementById("profileDisplayName").textContent = newFullName;
          if (avatarUrl) document.getElementById("profileAvatarPreview").src = avatarUrl;
        }

        saveBtn.disabled = false;
        saveBtn.textContent = "Simpan Perubahan Profil";
      });
    });
  </script>
</body>
</html>
